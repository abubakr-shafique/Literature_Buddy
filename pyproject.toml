[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-buddy"
version = "0.1.0"
description = "Interactive scientific literature reading assistant with local LLM/VLM support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Literature Buddy Contributors" }]
keywords = ["scientific-literature", "rag", "llm", "vlm", "pdf", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "PySide6>=6.7",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "requests>=2.31",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "ollama>=0.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
all = [
    "transformers>=4.46",
    "torch>=2.4",
    "bitsandbytes>=0.44; platform_system != 'Windows'",
    "llama-cpp-python>=0.2.90",
    "FlagEmbedding>=1.3",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]

[project.scripts]
literature-buddy = "literature_buddy.main:main"

[project.urls]
Homepage = "https://github.com/your-org/literature-buddy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
