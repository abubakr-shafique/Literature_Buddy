# 24 GB VRAM - in-process Transformers + bitsandbytes 4-bit (~16-18 GB incl. cache at 16k ctx)
llm:
  provider: transformers
  model: Qwen/Qwen3.8-27B
  quantization: 4bit
  context_length: 16384
  max_new_tokens: 1200
  think: false
vlm:
  same_as_llm: true
embedding:
  provider: sentence_transformers
  model: Qwen/Qwen3-Embedding-0.6B
  query_prompt: "Instruct: Given a question about a scientific paper, retrieve passages that answer it\nQuery: "
retrieval:
  top_k: 10
  rerank: true
  reranker_model: BAAI/bge-reranker-v2-m3
  max_context_tokens: 8000
