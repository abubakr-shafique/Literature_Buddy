# 16 GB VRAM - in-process Transformers + bitsandbytes 4-bit, weights from ./models (or HF cache)
# One natively multimodal model serves as both LLM and VLM (loaded once).
llm:
  provider: transformers
  model: Qwen/Qwen3.5-9B
  quantization: 4bit
  context_length: 16384
  max_new_tokens: 1024
  think: false
vlm:
  same_as_llm: true
embedding:
  provider: sentence_transformers
  model: Qwen/Qwen3-Embedding-0.6B
  query_prompt: "Instruct: Given a question about a scientific paper, retrieve passages that answer it\nQuery: "
retrieval:
  top_k: 8
  rerank: true
  reranker_model: BAAI/bge-reranker-v2-m3
  max_context_tokens: 5500
