# 24 GB VRAM - Ollama (llama.cpp GGUF). No PyTorch required.
#   ollama pull qwen3.8:27b && ollama pull qwen3-embedding:0.6b
llm:
  provider: ollama
  model: qwen3.8:27b
  base_url: http://localhost:11434
  context_length: 16384
  max_new_tokens: 1200
  think: false
vlm:
  same_as_llm: true
embedding:
  provider: ollama
  model: qwen3-embedding:0.6b
  query_prompt: "Instruct: Given a question about a scientific paper, retrieve passages that answer it\nQuery: "
retrieval:
  top_k: 10
  rerank: false
  max_context_tokens: 8000
