# 16 GB VRAM - Ollama (llama.cpp GGUF). No PyTorch required.
#   ollama pull qwen3.5:9b && ollama pull qwen3-embedding:0.6b
llm:
  provider: ollama
  model: qwen3.5:9b
  base_url: http://localhost:11434
  context_length: 16384
  max_new_tokens: 1024
  think: false
vlm:
  same_as_llm: true
embedding:
  provider: ollama
  model: qwen3-embedding:0.6b
  query_prompt: "Instruct: Given a question about a scientific paper, retrieve passages that answer it\nQuery: "
retrieval:
  top_k: 8
  rerank: false        # the cross-encoder needs the torch stack; hybrid search stays on
  max_context_tokens: 5500
