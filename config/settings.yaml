# Literature Buddy Configuration

app:
  name: "Literature Buddy"
  version: "0.1.0"
  window_size:
    width: 1200
    height: 800

# Local Model Configuration
models:
  # Path to local model directory (relative to project root or absolute)
  local_model_path: "./models"
  
  # Embedding model (local)
  embedding:
    model_name: "all-MiniLM-L6-v2"
    cache_dir: "./models/embeddings"
    device: "cpu"  # Use "cuda" if available
  
  # LLM for chat (local)
  llm:
    model_name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
    cache_dir: "./models/llm"
    device: "cpu"
    max_context_length: 2048
    max_new_tokens: 512
    temperature: 0.7
  
  # Reranker model (optional, local)
  reranker:
    model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    cache_dir: "./models/reranker"
    device: "cpu"
    top_k: 5

# RAG Configuration
rag:
  chunk_size: 512
  chunk_overlap: 50
  top_k_results: 5
  use_reranker: true
  
# PDF Processing
pdf:
  max_file_size_mb: 100
  dpi: 150

# UI
ui:
  theme: "light"
  highlight_color: "#FFFF00"
  font_size: 14